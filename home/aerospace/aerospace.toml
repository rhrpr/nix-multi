# AeroSpace — managed by Home Manager (home/macos/aerospace.nix).
# Linked to ~/.aerospace.toml. App → workspace rules are appended at build
# time from programs.controlRoom.apps (home/macos/control-room/config.nix), so
# the same table drives window placement and `control-room desk reset`.
#
# Workspace 1AI is the AI control room: one full-screen Ghostty window running
# Herdr, with every Claude/Codex/Gemini pane inside it.

after-login-command = []

# JankyBorders highlights the focused window (brew: FelixKratz/formulae/borders).
after-startup-command = [
  'exec-and-forget borders active_color=0xffb362ff inactive_color=0xff494d64 width=5.0',
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
key-mapping.preset = 'qwerty'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 5
outer.bottom = 5
outer.top = 5
outer.right = 5

[exec]
inherit-env-vars = true
[exec.env-vars]
PATH = '@EXEC_PATH@:${PATH}'

[mode.main.binding]

# Terminal / control room
alt-enter = 'exec-and-forget open -na Ghostty'
alt-a = 'workspace 1AI'
alt-shift-a = 'exec-and-forget control-room attach-window'
alt-shift-u = 'exec-and-forget control-room up --revive'

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'fullscreen'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

alt-1 = 'workspace 1AI'
alt-2 = 'workspace 2Code'
alt-3 = 'workspace 3Work'
alt-4 = 'workspace 4Firefox'
alt-5 = 'workspace 5Chrome'
alt-6 = 'workspace 6Chat'
alt-7 = 'workspace 7Music'
alt-8 = 'workspace 8Mail'
alt-9 = 'workspace 9File'
alt-0 = 'workspace 0Other'

alt-shift-1 = 'move-node-to-workspace 1AI'
alt-shift-2 = 'move-node-to-workspace 2Code'
alt-shift-3 = 'move-node-to-workspace 3Work'
alt-shift-4 = 'move-node-to-workspace 4Firefox'
alt-shift-5 = 'move-node-to-workspace 5Chrome'
alt-shift-6 = 'move-node-to-workspace 6Chat'
alt-shift-7 = 'move-node-to-workspace 7Music'
alt-shift-8 = 'move-node-to-workspace 8Mail'
alt-shift-9 = 'move-node-to-workspace 9File'
alt-shift-0 = 'move-node-to-workspace 0Other'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'
alt-shift-c = 'reload-config'
alt-r = 'mode resize'

cmd-h = []     # Disable "hide application"
cmd-alt-h = [] # Disable "hide others"

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # toggle floating/tiling
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# =================================================================
# Multiple monitors: the control room lives on the main display.
# =================================================================

[workspace-to-monitor-force-assignment]
1AI = 'main'
2Code = 'main'
3Work = 'main'
4Firefox = 'main'
5Chrome = 'secondary'
6Chat = 'main'
7Music = 'main'
8Mail = 'main'
9File = 'main'
0Other = 'main'

# =================================================================
# App → workspace rules (generated from programs.controlRoom.apps)
# =================================================================
