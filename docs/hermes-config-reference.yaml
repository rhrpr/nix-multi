# ~/.hermes/config.yaml
# ─────────────────────────────────────────────────────────────────────────────
# HERMES AGENT — M4 MacBook Pro 24 GB — Complete Reference Configuration
#
# MANAGED SECTIONS (written by Nix via home/macos/hermes.nix):
#   provider_routing, auxiliary, delegation, fallback_providers
#
# GENERATED SECTIONS (written by `hermes model` OAuth flow — do NOT overwrite):
#   model:
#
# OPTIONAL SECTIONS (set manually or via `hermes config set`):
#   terminal, database, compression, memory, agent, prompt_caching, worktree
#
# Replace <LOCAL_MODEL_ID> with the exact ID from:
#   hermes-model-discover
#   # or: curl -s http://localhost:1234/v1/models | jq -r '.data[].id'
#
# Replace <OPENROUTER_FALLBACK_MODEL> with a current model from openrouter.ai/models
#   Suggested default: google/gemini-2.5-flash
# ─────────────────────────────────────────────────────────────────────────────


# ── MAIN MODEL (generated by `hermes model` — do not edit manually) ──────────
#
# model:
#   provider: openai-codex
#   model: <codex-model-id>          # discovered at OAuth time
#   lmstudio_load_mode: jit          # set via: hermes config set model.lmstudio_load_mode jit


# ── PROVIDER ROUTING ─────────────────────────────────────────────────────────
# Only affects traffic that actually travels through OpenRouter (PAYG path).
# Has no effect on Codex subscription or LM Studio traffic.
provider_routing:
  sort: "price"
  data_collection: "deny"


# ── TERMINAL BACKEND ─────────────────────────────────────────────────────────
# For local macOS use, the `local` backend is correct.
# Other backends: docker, ssh, modal, daytona, vercel_sandbox, singularity
terminal:
  backend: local
  cwd: "."
  timeout: 180
  home_mode: auto          # auto | real | profile
  persistent_shell: true
  env_passthrough: []


# ── DATABASE ──────────────────────────────────────────────────────────────────
database:
  journal_mode: wal        # wal is faster; delete is safer on network fs
  synchronous: NORMAL      # OFF | NORMAL | FULL | EXTRA
  wal_autocheckpoint: 1000
  journal_size_limit: 67108864


# ── CONTEXT COMPRESSION ──────────────────────────────────────────────────────
# These are the global compression engine settings.
# Per-task compression model routing is under auxiliary.compression below.
compression:
  enabled: true
  progress_notices: false
  threshold: 0.50                       # Compress when context is 50% full
  target_ratio: 0.20                    # Compress down to 20% of window
  tail_mode: lean                       # lean | legacy
  protect_last_n: 20                    # Always keep the last 20 messages
  protect_first_n: 3                    # Always keep the first 3 messages
  in_place: true
  idle_compact_after_seconds: 0         # 0 = disabled
  hygiene_hard_message_limit: 5000
  hygiene_timeout_seconds: 30
  hygiene_total_ceiling_seconds: 600
  hygiene_max_turn_hold_seconds: 10
  hygiene_failure_cooldown_seconds: 300
  context_timeout_seconds: 120
  context_total_ceiling_seconds: 600
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096


# ── MEMORY ───────────────────────────────────────────────────────────────────
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  write_approval: false     # Set true to require approval before memory writes


# ── PROMPT CACHING ───────────────────────────────────────────────────────────
# Supported on providers that offer prompt cache (Anthropic, some OpenRouter models).
prompt_caching:
  cache_ttl: "5m"           # "5m" | "1h"


# ── GIT / WORKTREE ───────────────────────────────────────────────────────────
worktree: true
worktree_sync: true


# ── GOALS ────────────────────────────────────────────────────────────────────
goals:
  max_turns: 20


# ── AGENT BEHAVIOR ───────────────────────────────────────────────────────────
agent:
  gateway_turn_lease_timeout: 1800
  session_stall_timeout: 300
  reconnect_attention_after: 7200
  max_turns: none
  api_max_retries: 3
  run_budget_seconds: null
  verify_on_stop: auto      # false | true | "auto"
  verify_guidance: true
  max_verify_nudges: 3
  coding_instructions: ""
  reasoning_effort: null    # null | none | minimal | low | medium | high
  local_stream_stale_timeout: 900
  agent_cache:
    max_size: 128
    idle_ttl_secs: 3600
    memory_high_mb: auto
    max_evictions_per_pass: 16
    protect_recent: 8


# ── FILE / TOOL OUTPUT LIMITS ─────────────────────────────────────────────────
context_file_max_chars: null
file_read_max_chars: 100000
tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000
tool_budget:
  mcp_result_size_chars: 50000


# ── UPDATES ───────────────────────────────────────────────────────────────────
updates:
  pre_update_backup: quick       # quick | full | off
  backup_keep: 5
  non_interactive_local_changes: stash    # stash | discard
  auto_switch_parked_branch: true


# ── LOCAL AUXILIARY TASKS → LM Studio ────────────────────────────────────────
#
# Background/cheap tasks go to the local M4 worker to preserve Codex quota.
# Each task has a fallback_chain to the main model for availability resilience.
#
# CONCURRENCY NOTE (24 GB M4):
#   Start at max_concurrency: 1.
#   After benchmarking memory pressure and token throughput, raise to 2.
#   Do not start with recursive/nested local agent trees.
#
auxiliary:
  max_concurrency: 1

  compression:
    base_url: "http://localhost:1234/v1"
    api_key: "local-key"
    model: "<LOCAL_MODEL_ID>"
    timeout: 180
    fallback_chain:
      - provider: "main"

  title_generation:
    enabled: true
    base_url: "http://localhost:1234/v1"
    api_key: "local-key"
    model: "<LOCAL_MODEL_ID>"
    timeout: 60
    fallback_chain:
      - provider: "main"

  approval:
    base_url: "http://localhost:1234/v1"
    api_key: "local-key"
    model: "<LOCAL_MODEL_ID>"
    timeout: 60
    fallback_chain:
      - provider: "main"

  triage_specifier:
    base_url: "http://localhost:1234/v1"
    api_key: "local-key"
    model: "<LOCAL_MODEL_ID>"
    timeout: 120
    fallback_chain:
      - provider: "main"

  skills_hub:
    base_url: "http://localhost:1234/v1"
    api_key: "local-key"
    model: "<LOCAL_MODEL_ID>"
    timeout: 60
    fallback_chain:
      - provider: "main"

  mcp:
    base_url: "http://localhost:1234/v1"
    api_key: "local-key"
    model: "<LOCAL_MODEL_ID>"
    timeout: 60
    fallback_chain:
      - provider: "main"

  # Enable only after confirming the local model has usable vision support.
  # Test with: lms load <LOCAL_MODEL_ID> --context-length 64000
  vision:
    base_url: "http://localhost:1234/v1"
    api_key: "local-key"
    model: "<LOCAL_MODEL_ID>"
    timeout: 180
    fallback_chain:
      - provider: "main"


# ── LOCAL SUBAGENT DELEGATION ─────────────────────────────────────────────────
#
# Codex plans and synthesises; local Qwen workers perform delegated work.
# base_url takes precedence over provider and sends delegated children
# directly to the local OpenAI-compatible LM Studio endpoint.
#
# SPAWN DEPTH: max_spawn_depth: 1 prevents delegated workers from
# recursively spawning more workers on a 24 GB machine.
#
delegation:
  model: "<LOCAL_MODEL_ID>"
  base_url: "http://localhost:1234/v1"
  api_key: "local-key"
  api_mode: "chat_completions"
  max_concurrent_children: 1    # Raise to 2 only after Phase 1 benchmarks
  max_spawn_depth: 1            # No recursive local agent trees
  orchestrator_enabled: false   # Keep topology flat while tuning
  max_iterations: 30            # Guard against unexpectedly long local loops


# ── MAIN MODEL FAILURE FALLBACK ──────────────────────────────────────────────
#
# Availability failover ONLY — not complexity-based routing.
# Normal path: Codex main → LM Studio auxiliary/delegation
# Fallback path: Codex fails → LM Studio → OpenRouter
#
# Do NOT rely on fallback_providers for cost optimisation.
# Cost savings come from auxiliary.* and delegation routing above.
#
fallback_providers:
  - provider: "lmstudio"
    model: "<LOCAL_MODEL_ID>"
  - provider: "openrouter"
    model: "<OPENROUTER_FALLBACK_MODEL>"    # e.g. google/gemini-2.5-flash
